server:
  port: ${PORT:8080}

spring:
  application:
    name: cab-booking-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cab_booking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:replace_with_a_long_random_secret_at_least_32_characters}
    expiration-minutes: 1440

  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"

    demo-seed: ${APP_DEMO_SEED:false}