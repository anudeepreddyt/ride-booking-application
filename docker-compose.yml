services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cab_booking}
      POSTGRES_USER: ${POSTGRES_USER:-cab_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "5432:5432"
    volumes:
      - cab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cab_user} -d ${POSTGRES_DB:-cab_booking}"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cab_booking}
      DB_USERNAME: ${POSTGRES_USER:-cab_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_long_random_secret_at_least_32_characters}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_DEMO_SEED: ${APP_DEMO_SEED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  cab-postgres-data:
